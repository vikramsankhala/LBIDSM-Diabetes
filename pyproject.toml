[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lbidsm-diabetes"
version = "0.1.0"
description = "Research-only layered diabetes decision-support architecture demonstrator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "streamlit>=1.35,<2", "plotly>=5.20,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
